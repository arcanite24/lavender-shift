# Codegen facts for Forza Horizon 2's default.xex with title update v2
# applied (0.0.2.12). Stage 0 reference build (docs/APPROACH_RESEARCH.md).
#
# Every address here was carried from Pinyon Shift's FH1 v4 analysis
# (horizon1-recomp config/rexglue/analysis-v4/main-xex.toml) through Pinyon's
# base-to-v4 address mapper (tools/map-fh1-v4-addresses.py) run on the FH1 v4
# and FH2 v2 images, then checked: the method column says how each one mapped.

# Microsoft CRT non-local jump pair (longjmp exact, setjmp by context).
setjmp_address = 0x82C059D0
longjmp_address = 0x82C054A0

# Pinyon's kept, exact codegen options (FH1 reasons hold for FH2: the .text
# has no overflow-enabled integer instruction and one mtxer, like FH1).
cr_as_local = true
ctr_as_local = true
xer_as_local = true
interior_resume = false
direct_calls_bypass_thunk = true
# Direct calls name the strong `__imp__sub_` definitions; the functions the
# app replaces with a strong `sub_` of its own must go through the weak
# thunk instead, or the replacement only sees indirect calls.
# 0x82B72EA8: the ring-room poll (src/ring_wait.cpp).
host_overridden_functions = [0x82B72EA8]
fold_rodata_loads = true
host_local_register_saves = true
host_local_lr = true

# CRT memory functions and XAPI fibers, served by the SDK. The four fiber
# functions map exactly; SwitchToFiber is, as in FH1, a tail branch to the
# context switch, here 0x831D9180 (FH1 0x831AF790, mapped by context).
[rexcrt]
memcpy = 0x82C00D70
memmove = 0x82C012E0
memset = 0x82C02780
ConvertThreadToFiber = 0x831D7918
ConvertFiberToThread = 0x831D79A8
CreateFiber = 0x831D79F8
DeleteFiber = 0x831D7AD8
SwitchToFiber = 0x831D7B38

