# Named FH2 TU v2 addresses and offsets that Lavender's code uses. The
# findings behind each are in docs/findings/; every hook site here is also
# a [[midasm_hook]] in config/analysis/default.toml.

executable = "default.xex"  # USA disc with TU v2 applied

[symbols]
"simulation.delta_store" = 0x823FDEF4      # f31 = the step's delta, stored at owner+448
"gpu.ring_wait_poll" = 0x82B72EA8          # D3D ring-room and fence wait poll
"post.bloom_scale" = 0x82474E2C            # frame's bloom scale at r1+264
"post.motion_blur_store" = 0x82F0483C      # stfs f8 -> r3+80, scene load only
"post.dof_decisions" = [0x8246AC34, 0x82467C0C, 0x82467C3C]
"render.setting_loaded" = 0x82F0D058       # r30 control, r26 scenario
"render.float_control_vtable" = 0x8224B4B4
"render.bool_control_vtable" = 0x8224B584
"camera.fov_return" = 0x829BB414           # f1 = vertical FOV, radians
"hud.hidden_byte" = 0x83449CA2
"time_of_day.from_world" = 0x82496DA0      # r3 world -> r3 world+232
"launch_options.object" = 0x83427B80
"launch_options.vtable" = 0x8201703C
"gpu.render_job_wait" = 0x82405248        # before each producer yield, counter r1+84
"pacing.late_swap_test" = 0x82B71844      # r7 percent late, r8 previous target, r10 vblank
"movie.decode_result" = 0x82FEB3DC        # r3 = the XMedia wrapper's result
"view.aspect_return" = 0x823F2354         # f1 = width / height of the viewport in r3
"view.game_projection_return" = 0x82B24824
"view.map_projection_return" = 0x82789EC0
"game.object" = 0x83422224                # [this] is the game object
"game.world_of" = 0x8248F578              # (game, 0) -> where the world pointer is
"world.player_car_slot" = 0x8249BE10      # (world, 0) -> slot, [slot] = car
"car.set_control_mode" = 0x824FAA98       # (car, mode) 0 player, 1 or 3 AI
"crt.pow" = 0x82448D90                    # f1 = pow(f1, f2), replaced natively
"crt.log" = 0x82C04490                    # natural log, pow's exponent-1 path
"ui.live_unavailable" = 0x826CDF40        # (owner, request) FEATURE UNAVAILABLE popup
"ui.post_message" = 0x826A3510            # (owner, message, payload, flags)
"ui.string_lookup" = 0x82E34E90           # (table, id) big-endian UTF-16 text
"ui.ids_multiplayer_option" = 0x834584E4  # string ID global: pause tile ONLINE ROAD TRIP
"ui.animated_camera_step" = 0x8279A368    # r31 camera, f1 its fixed 1/30 s step
"crowd.update_begin" = 0x82F95788         # r29 the procedural models object
"crowd.step_random" = 0x82F95EC4          # r10 per-frame step, random-clip instances
"crowd.step_looping" = 0x82F961F0         # r10 per-frame step, looping instances

[offsets]
"render.scenario_skip_shadow" = 0x194      # bool control in each scenario
"render.scenario_set_bits" = 40            # bit 3: SkipShadowMapUnlessCockpit set
"world.time_of_day" = 232
"time_of_day.seconds" = 10488              # float, seconds since midnight
"launch_options.allowskipvoiceover" = 4936
"launch_options.NoHandOfGodReset" = 4949
"launch_options.noattractvideo" = 4222
"launch_options.disablephotomodecollisiondetection" = 4933
"launch_options.nohud" = 3209
"world.session" = 124
"session.game_mode" = 56                   # 17 = free roam
"car.control_mode" = 15400
"launch_options.engageaionstart" = 3076    # parsed, no reader found
"launch_options.enableaitoggle" = 3109     # parsed, no reader found
