[[finding]]
group = """Post effects"""
name = """motion blur velocity pass and stencil object IDs"""
v2 = """GPU only: pixel shader ucode hash ADD2563BA387C2BF, a 640x360 pass after the bloom chain"""
what = """Camera motion blur reprojects each pixel from the main view's depth-stencil resolve (D24FS8 read as 8_8_8_8: float depth in three bytes, stencil in the fourth) into a half-resolution velocity buffer, which the final composite blurs along. The stencil is an object ID in steps of 3 (the player car writes 0x0F, ID 5; other cars 0x06 and 0x0C; the world 0), and ID n selects the transform at pixel constants c32+4n. Stencil values at or above the threshold in c253.w are flags and use the world's transform: grass writes 0x81, and each car shadow's stencil volume (a 30-index box with z-pass invert on bit 7, then a shadow draw where stencil equals 0x80) marks the road it covers with 0x80. The threshold, 0x3F008100, is 128/255 plus half a 16-bit step, so 0x80 is not counted as a flag; it reads as ID 43, whose constants hold identity, and that road gets no velocity: an unblurred square under every moving car. Treating the threshold as 0.5 for this shader blurs that road like the rest, keeps the car shadows, and leaves the car sharp."""
how = """Frame dump taken at about 100 km/h, replayed offline: fh1_debug_skip_draws bisection (the pass, then the shadow-volume draws), the resolved depth-stencil untiled and compared between the depth prepass and the colour pass's per-band resolve, and the pass's constants logged at the draw; the fix checked in the replay."""
confidence = """confirmed"""
note = """The colour pass draws in three screen bands (EDRAM tiling) and resolves each band's depth-stencil over the depth prepass's copy, which is how the 0x80 marks reach the velocity pass. The stencil values and the IDs are this frame's (free roam, one other car)."""
source = """docs/STAGE0.md "Motion blur"; src/lavender_shift_app.cpp (gpu_pixel_constant_fixups default)"""

