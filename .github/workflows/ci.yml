name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The game itself needs the player's disc to build, so CI checks what it
  # can without it: the repository boundary, the launcher and the scripts.
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repository boundary
        shell: powershell
        run: ./tools/check-repository-boundary.ps1
      - name: PowerShell scripts parse
        shell: powershell
        run: |
          $failed = $false
          foreach ($file in Get-ChildItem tools -Filter *.ps1) {
            $errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors)
            foreach ($e in $errors) { Write-Host "$($file.Name):$($e.Extent.StartLineNumber): $($e.Message)"; $failed = $true }
          }
          if ($failed) { exit 1 }
      - name: Python tools compile
        run: python -m py_compile (Get-ChildItem tools -Filter *.py).FullName
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Launcher builds
        run: dotnet build launcher/LavenderShift.Launcher -c Release
